name: Verify deposited-particle tracking
on:
  push:
    branches: ['codex/verify-deposition-interactions']
permissions:
  contents: read
jobs:
  openfoam:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and run OpenFOAM v2406 comparison
        run: |
          docker run --rm --user 0:0 -v "$PWD:/work" -w /work --entrypoint /bin/bash \
            opencfd/openfoam-default:2406 -lc '
              set -e
              if ! command -v python3 >/dev/null; then
                apt-get update -qq
                apt-get install -y -qq python3
              fi
              source /usr/lib/openfoam/openfoam2406/etc/bashrc
              export WM_NCOMPPROCS=4
              ./Allwmake
              python3 tests/force/deposition_interaction.py
            '
